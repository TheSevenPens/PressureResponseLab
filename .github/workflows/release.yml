name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore PressureResponseLab.slnx

      - name: Publish (win-x64, self-contained, single file)
        run: >
          dotnet publish PressureResponseLab/PressureResponseLab.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Package zip
        id: package
        shell: pwsh
        run: |
          $name = "PressureResponseLab-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish\* -DestinationPath $name -Force
          "zip=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.package.outputs.zip }}"
          --title "PressureResponseLab ${{ steps.version.outputs.version }}"
          --generate-notes
